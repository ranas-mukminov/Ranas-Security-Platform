name: Falco 4059 Debian metadata regression

on:
  push:
    branches:
      - ci/falco-4059-apt-metadata-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    steps:
      - name: Checkout validation script
        uses: actions/checkout@v4
      - name: Checkout public Falco source
        uses: actions/checkout@v4
        with:
          repository: falcosecurity/falco
          ref: master
          path: falco
      - name: Install apt-ftparchive
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils
      - name: Test official Falco package scripts
        run: python3 falco/scripts/packaging/test_package_scripts.py
      - name: Check real Debian Release metadata
        run: python3 .github/scripts/validate_falco_4059.py falco/scripts/publish-deb ${{ matrix.phase }}
