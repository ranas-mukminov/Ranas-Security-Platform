name: Validate Falco #4059 with real Debian apt-ftparchive

on:
  push:
    branches:
      - ci/falco-4059-apt-metadata-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-debian-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: ["before", "after"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: falcosecurity/falco
          ref: master
          path: falco
      - name: Install real Debian metadata generator
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils
      - name: Verify official package maintainer tests
        run: python3 falco/scripts/packaging/test_package_scripts.py
      - name: Verify architecture metadata end-to-end with apt-ftparchive
        env:
          PHASE: ${{ matrix.phase }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import tempfile

          s = Path("falco/scripts/publish-deb").read_text()
          original = 'APT::FTPArchive::Release::Architectures="$(join_arr , "${architectures[@]}")"'
          corrected = 'APT::FTPArchive::Release::Architectures="$(join_arr " " "${architectures[@]}")"'
          assert original in s, "Upstream source changed: revalidate patch"
          if os.environ["PHASE"] == "after":
              s = s.replace(original, corrected)
          line = next(line for line in s.splitlines()
                      if 'APT::FTPArchive::Release::Architectures=' in line)
          separator = '" "' if corrected in line else ','
          helper = re.search(r"(?ms)^join_arr\(\) \{\n.*?^\}", s)
          assert helper, "Missing real join_arr helper"
          shell = (helper.group() + "\n"
                   + 'architectures=(amd64 arm64)\n'
                   + f'join_arr {separator} "${{architectures[@]}}"')
          joined = subprocess.check_output(["bash", "-c", shell], text=True).strip()
          expected = "amd64 arm64" if os.environ["PHASE"] == "after" else "amd64,arm64"
          assert joined == expected, (joined, expected)
          with tempfile.TemporaryDirectory() as td:
              root = Path(td) / "dists" / "stable"
              packages = root / "main" / "binary-amd64"
              packages.mkdir(parents=True)
              (packages / "Packages").write_text("")
              result = subprocess.run(
                  ["apt-ftparchive", "release",
                   "-o", "APT::FTPArchive::Release::Origin=Falco",
                   "-o", f"APT::FTPArchive::Release::Architectures={joined}",
                   str(root)],
                  capture_output=True, text=True, check=True,
              )
              lines = result.stdout.splitlines()
              arch_line = next(line for line in lines if line.startswith("Architectures:"))
              assert arch_line == f"Architectures: {expected}", arch_line
              print(f"Validated {os.environ['PHASE']}: {arch_line}")
              if os.environ["PHASE"] == "after":
                  assert arch_line == "Architectures: amd64 arm64", arch_line
              else:
                  assert arch_line == "Architectures: amd64,arm64", arch_line
          PY
